  <rect x="13" y="12" width="6" height="10" fill="#E03030" stroke="#2C1F14" stroke-width="2"/>
  <rect x="24" y="14" width="6" height="8" fill="#4E7C56" stroke="#2C1F14" stroke-width="2"/>
