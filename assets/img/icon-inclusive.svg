  <rect x="13" y="4" width="6" height="6" fill="#E03030" stroke="#2C1F14" stroke-width="2"/>
  <rect x="24" y="6" width="6" height="6" fill="#4E7C56" stroke="#2C1F14" stroke-width="2"/>
  <!-- Bodies -->
